name: ichu_mobile_app
description: "ICHU by SmartFarm: the Android and iOS livestock management client."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  shared_preferences: ^2.5.6
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  http: ^1.6.0
  go_router: ^18.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/ichu_mark.png
    - assets/images/login_andean_herd.webp
    - assets/fonts/outfit/OFL.txt
    - assets/fonts/plus_jakarta_sans/OFL.txt
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/outfit/Outfit.ttf
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans.ttf
